name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/deploy/backend
            git pull origin main
            npm install
            npx prisma migrate deploy
            npx prisma generate
            npm run build
            pm2 restart backend
