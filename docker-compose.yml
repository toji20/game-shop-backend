services:

  postgres:
    container_name: game-shop
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nestjs-shop

volumes:
  postgres_data:

networks:
  nestjs-shop:
      